# profiles.conf — the named token purposes cf-scoped-run.sh can mint.
#
# THIS FILE IS THE ONE HOME OF THE PROFILE SET. Adding a profile is ONE edit
# here; no code changes anywhere. cf-scoped-run.sh reads it, --list-profiles
# prints it, and an unknown --profile is refused by name against it.
#
# Format — one profile per block, blank-line separated, `key: value` lines:
#
#   profile: <name>            the --profile <name> handle (required, unique)
#   perm:    <Name:Level>      a Cloudflare permission, repeatable (required).
#                              Names are the human names shown in Cloudflare's
#                              token editor; cf-mint-token.sh resolves each to a
#                              permission-group UUID by a LIVE catalogue read, so
#                              no UUID is ever hardcoded here and a renamed group
#                              fails loudly at mint instead of silently granting
#                              the wrong thing.
#   scope:   zone | account    zone  -> the run must name a --zone/--zone-id
#                              account -> zone flags are refused (nothing to scope)
#   ttl:     <n>[s|m|h|d]      default lifetime for this profile (a run's --ttl wins)
#   why:     <one line>        what this token is for; printed at mint and by
#                              --list-profiles, so an operator picking a profile
#                              sees the reach they are handing out.
#
# Lines starting with # are comments. Unknown keys are refused by name.

profile: dns-edit
perm: DNS:Edit
perm: Zone:Read
scope: zone
ttl: 15m
why: write DNS records in one zone — record publishing, ACME/DNS-01, cleanup sweeps

profile: dns-read
perm: DNS:Read
perm: Zone:Read
scope: zone
ttl: 15m
why: read DNS records in one zone without any ability to change them (audits, drift checks)

profile: zone-settings
perm: Zone Settings:Edit
perm: Zone:Read
scope: zone
ttl: 15m
why: flip zone-level settings (TLS mode, Authenticated Origin Pulls, HTTP/3, …)

profile: zone-harden
perm: DNS:Edit
perm: Zone Settings:Edit
perm: Zone WAF:Edit
perm: Firewall Services:Edit
perm: SSL and Certificates:Edit
perm: Analytics:Read
scope: zone
ttl: 30m
why: a full edge-hardening pass over a zone. Analytics:Read is required to review
     firewall events (the GraphQL firewallEventsAdaptive dataset refuses a token
     without zone analytics read); Firewall Services:Edit is required for zone
     lockdown rules (the legacy /firewall/lockdowns endpoint is not covered by
     Zone WAF and answers 10000 without it).

profile: certs
perm: SSL and Certificates:Edit
scope: zone
ttl: 15m
why: certificate work only — Origin CA issuance and custom-hostname management,
     with none of the DNS/WAF/firewall reach of zone-harden

profile: pages-deploy
perm: Pages:Edit
perm: Pages:Read
scope: account
ttl: 30m
why: publish a Cloudflare Pages deployment (account-scoped; no zone applies)

profile: workers-deploy
perm: Workers Scripts:Edit
scope: account
ttl: 30m
why: publish a Workers script (account-scoped; no zone applies)
